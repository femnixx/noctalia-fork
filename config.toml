# Noctalia configuration tuned to match dynamic-notch-niri QML shell palette.
# QML shell colors:
#   background: #141414 / #0a0a0a
#   card border: #3a3a3a
#   dim text: #9a9aa0
#   accent: #3b8bff
#   white text: #ffffff

# ── Shell ─────────────────────────────────────────────────────────────────────

[accessibility]
ui_scale              = 1.0
high_contrast         = false

[shell]
corner_radius_scale   = 1.4          # closer to QML's 18px radius
font_family           = "sans-serif"
time_format           = "{:%H:%M}"
date_format           = "%A, %x"
offline_mode          = false
telemetry_enabled     = false
niri_overview_type_to_launch_enabled = false
polkit_colorize_icons = false
screen_time_colorize_icons = false
polkit_agent          = false
password_style        = "default"
readline_shortcuts    = false
settings_show_advanced = true
settings_expand_all_groups = false
show_location         = true
clipboard_enabled     = true
clipboard_history_max_entries = 100
clipboard_keep_from_closed_apps = true
clipboard_auto_paste  = "auto"
clipboard_image_action_command = ""
shared_gl_context     = true
circular_avatar       = true

[shell.screenshot]
skip_annotate_on_copy_save = false
close_on_copy = true
close_on_save = true
copy_on_close = false

[shell.privacy]
mic_filter_regex = ""
cam_filter_regex = ""
screen_filter_regex = ""

[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down"
alpha     = 0.40

[shell.panel]
transparency_mode     = "solid"
borders               = true
border_color          = "#3a3a3a"     # QML card border color
border_width          = 1.0
shadow                = true
launcher_placement       = "floating"
clipboard_placement      = "floating"
control_center_placement = "attached"
wallpaper_placement      = "attached"
session_placement        = "attached"
launcher_position        = "center"
clipboard_position       = "center"
open_near_click_control_center = false
open_near_click_launcher       = false
open_near_click_clipboard      = false
open_near_click_wallpaper      = false
open_near_click_session        = false

[shell.launcher]
colorize_icons = false
layout = "full"
width = 760
search_position = "top"
default_view   = "recent"
categories = true
category_icons_only = false
show_navigation_labels = true
show_settings_button = true
show_session_button = true
show_icons    = true
show_app_origin_indicator = true
compact       = false
app_grid      = false
track_usage   = true
sort_by_usage = true
ignore_mouse  = false
pinned        = []
fetch_exchange_rates = false
provider_prefix = "/"
auto_paste = "auto"

[shell.launcher.providers.calculator]
prefix = "calc"
global = true

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
prefix = "session"
global = false

[shell.launcher.providers.wallpaper]
prefix = "wall"

[shell.launcher.providers.windows]
prefix = "win"

[shell.mpris]
blacklist = []

[shell.window_switcher]
colorize_icons = false
style = "carousel"
mru = false
show_caption = true
show_count = true
show_app_icon = true

# ── Wallpaper ─────────────────────────────────────────────────────────────────

[wallpaper]
enabled             = false
fill_mode           = "crop"
fill_color          = "#141414"
transition          = ["fade"]
transition_duration = 1500
edge_smoothness     = 0.3
transition_on_startup = false
sync_transitions      = true
directory           = ""
directory_light     = ""
directory_dark      = ""

[wallpaper.default]
path = ""

[wallpaper.automation]
enabled                    = false
interval_seconds           = 1800
order                      = "random"
recursive                  = true

# ── Theme ─────────────────────────────────────────────────────────────────────

[theme]
mode   = "dark"
source = "builtin"
builtin = "Noctalia"
# community_palette = "Noctalia"
# wallpaper_scheme  = "m3-content"
pure_black_dark = true             # anchors dark surfaces to true black (#0a0a0a approx)

[theme.templates]
enable_builtin_templates            = true
builtin_ids                = []
enable_community_templates = true
community_ids              = []

# ── Backdrop ──────────────────────────────────────────────────────────────────

[backdrop]
enabled                = false
blur_intensity         = 0.0
tint_intensity         = 0.0

# ── Notifications ─────────────────────────────────────────────────────────────

[notification]
colorize_icons = false
enable_daemon      = true
show_app_name      = true
show_actions       = true
keep_dismissed_in_history = true
group_by_app       = true
layer              = "top"
scale              = 1.0
background_opacity = 0.97
border             = true
border_color       = "#3a3a3a"
border_width       = 1
follow_focused_output = false
offset_x           = 20
offset_y           = 8

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
position = "top_right"
position_vertical = "top_center"
orientation = "horizontal"
hide_delay_ms = 1400
scale = 1.0
background_opacity = 0.97
border = true
border_color = "#3a3a3a"
border_width = 1
follow_focused_output = false
offset_x = 20
offset_y = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
lock_keys = true
keyboard_layout = true
privacy = true

# ── Lock Screen ───────────────────────────────────────────────────────────────

[lockscreen]
enabled                 = true
grace_period_seconds    = 0
blurred_desktop         = false
transition              = ["fade"]
transition_duration     = 1500
edge_smoothness         = 0.3
blur_intensity          = 0.0
tint_intensity          = 0.0
tint_color              = "#141414"

# ── System Monitor ────────────────────────────────────────────────────────────

[system.monitor]
enabled = true
cpu_poll_seconds = 2.0
cpu_freq_activity_threshold = 2.5
cpu_freq_critical_threshold = 4.5
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0
disk_poll_seconds = 10.0

# ── Calendar ──────────────────────────────────────────────────────────────────

[calendar]
enabled                     = true
dedupe_events               = false
dedupe_ignore_patterns      = []
refresh_minutes             = 15
event_date_format           = "%A %e %B"
event_time_format           = "%H:%M"

[calendar.reminders]
enabled              = true
use_event_reminders  = true
default_lead_minutes = 10
all_day_digest_time  = "09:00"

[control_center.calendar]
show_events_card            = true
show_week_numbers           = false

# ── Weather ───────────────────────────────────────────────────────────────────

[weather]
enabled         = false
refresh_minutes = 30
unit            = "celsius"
effects         = false

# ── Audio ─────────────────────────────────────────────────────────────────────

[audio]
colorize_icons = false
enable_overdrive = false
enable_sounds = false
enable_volume_sounds = true
enable_notification_sounds = true
enable_power_sounds = true
enable_screenshot_sounds = true
sound_volume = 0.5
sound_theme = "freedesktop"
spectrum_frame_rate = 60

# ── Bluetooth ─────────────────────────────────────────────────────────────────

[bluetooth]
connect_when_enabled = false
connection_notifications = false

# ── Brightness ────────────────────────────────────────────────────────────────

[brightness]
enable_ddcutil = false

# ── Night Light ───────────────────────────────────────────────────────────────

[nightlight]
enabled              = false
force                = false
temperature_day      = 6500
temperature_night    = 4000

# ── Location ──────────────────────────────────────────────────────────────────

[location]
auto_locate      = false
address          = ""

# ── Idle ──────────────────────────────────────────────────────────────────────

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = false

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = false

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
validate = ["return", "kp_enter", "space"]
cancel   = ["escape"]
left     = ["left"]
right    = ["right"]
up       = ["up"]
down     = ["down"]
tab_next = ["tab"]
tab_previous = ["shift+iso_left_tab"]
delete   = ["del"]

# ── Bar ───────────────────────────────────────────────────────────────────────

[bar.main]
position           = "top"
thickness          = 34
background_opacity = 1.0
compositor_blur    = false
radius             = 12
margin_ends        = 180
margin_edge        = 10
padding            = 14
widget_spacing     = 6
scale              = 1.0
font_scale         = 1.0
shadow             = false
auto_hide          = false
reserve_space      = true
capsule            = false

start  = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end    = ["media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

# ── Dock ──────────────────────────────────────────────────────────────────────

[dock]
colorize_icons = false
enabled             = false
position            = "bottom"
icon_size           = 48
icon_shadow         = false
main_axis_padding   = 16
cross_axis_padding  = 8
item_spacing        = 6
background_opacity  = 0.88
compositor_blur     = false
radius              = 16
radius_top_left     = 16
radius_top_right    = 16
radius_bottom_left  = 16
radius_bottom_right = 16
margin_ends         = 0
margin_edge         = 8
shadow              = false
show_running        = true
auto_hide           = false
reserve_space       = true
layer               = "top"
active_scale        = 1.0
inactive_scale      = 0.85
magnification       = false
magnification_scale = 1.45
active_opacity      = 1.0
inactive_opacity    = 0.85
icon_saturation     = 1.0
show_dots           = false
show_instance_count = true
launcher_position   = "none"
launcher_icon       = "grid-dots"
active_monitor_only = false
pinned              = []

# ── Desktop Widgets ───────────────────────────────────────────────────────────

[desktop_widgets]
enabled = false

# ── Control Center ────────────────────────────────────────────────────────────

[control_center.media]
show_visualizer = false

[control_center]
show_avatar_border          = false

# ── Hooks ─────────────────────────────────────────────────────────────────────

[hooks]
